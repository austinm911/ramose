# Per-PR preview of the docs site (website/): deploy an isolated Alchemy stage
# `pr-<number>` on PRs that touch website/, post/update a PR comment with the
# preview URL, and destroy the stage when the PR closes (merged or not).
#
# State: the stack runs with ALCHEMY_STATE=local and the `.alchemy/` directory
# is carried between runs via the Actions cache, so re-pushes update the same
# Worker (stable URL) and the teardown run can destroy what the deploy run
# created. Cloudflare-hosted state (`Cloudflare.state()`) would avoid the
# cache, but its state store needs Secrets Store + edge-preview token scopes
# beyond the minimal CI token documented in CONTRIBUTING.md.
#
# Teardown is belt-and-suspenders: `alchemy destroy` against the cached state,
# then — in case the cache was evicted — the Worker named in the PR's preview
# comment is deleted directly via the Cloudflare API.
#
# Credentials come from the GitHub Environment "Development" — same as
# e2e-cloudflare.yml; see CONTRIBUTING.md.
name: Docs preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "website/**"
      - ".github/workflows/docs-preview.yml"

permissions:
  contents: read
  pull-requests: write

# Serialize per PR: a deploy and a teardown must never race on stack state.
concurrency:
  group: docs-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-preview
    # Forks have no access to the Development environment secrets; skip cleanly.
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: Development
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Restore stack state
        uses: actions/cache/restore@v4
        with:
          path: .alchemy
          key: docs-preview-state-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          restore-keys: |
            docs-preview-state-pr-${{ github.event.pull_request.number }}-
      - name: Deploy pr-${{ github.event.pull_request.number }} stage
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALCHEMY_STATE: local
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Need CLOUDFLARE_API_TOKEN (secret) and CLOUDFLARE_ACCOUNT_ID (variable or secret) on the Development environment. See CONTRIBUTING.md."
            exit 1
          fi
          bun alchemy deploy website/alchemy.run.ts \
            --stage "pr-${{ github.event.pull_request.number }}" --yes | tee deploy.log
          URL=$(grep -oE 'https://[^" ]+\.workers\.dev' deploy.log | tail -1)
          if [ -z "$URL" ]; then
            echo "::error::Deploy finished but no workers.dev URL found in the output."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Docs preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
      # Save even when the deploy failed partway: the state still names
      # whatever was created, and teardown needs it to clean up.
      - name: Save stack state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .alchemy
          key: docs-preview-state-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Comment preview URL on the PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = "<!-- ripple-docs-preview -->";
            const body = [
              marker,
              "## Docs preview deployed",
              "",
              `**URL:** ${process.env.PREVIEW_URL}`,
              "",
              `Built from ${context.payload.pull_request.head.sha.slice(0, 7)}.`,
              "",
              "---",
              "_Updates on every push; the preview is destroyed when this PR closes._",
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  teardown:
    name: destroy-preview
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: Development
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Restore stack state
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: .alchemy
          key: docs-preview-state-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          restore-keys: |
            docs-preview-state-pr-${{ github.event.pull_request.number }}-
      - name: Destroy pr-${{ github.event.pull_request.number }} stage
        if: steps.restore.outputs.cache-matched-key != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALCHEMY_STATE: local
        run: |
          bun alchemy destroy website/alchemy.run.ts \
            --stage "pr-${{ github.event.pull_request.number }}" --yes
      # Fallback for an evicted cache: the preview comment names the Worker
      # (first label of the workers.dev URL); delete it directly if it is
      # somehow still there. A no-op when `alchemy destroy` already ran.
      - name: Delete any leftover preview Worker by name
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          URL=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- ripple-docs-preview -->")) | .body' \
            | grep -oE 'https://[^ )*]+\.workers\.dev' | tail -1 || true)
          if [ -z "$URL" ]; then
            echo "No preview comment with a workers.dev URL; nothing to check."
            exit 0
          fi
          NAME=$(echo "$URL" | sed -E 's#https://([^.]+)\..*#\1#')
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$NAME?force=true" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          # 200 = deleted now (cache must have been evicted), 404 = already gone.
          echo "DELETE $NAME -> $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "404" ]; then
            echo "::error::Unexpected status $STATUS deleting leftover preview Worker $NAME."
            exit 1
          fi
      - name: Mark the preview comment as destroyed
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- ripple-docs-preview -->";
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (!existing) return;
            await github.rest.issues.updateComment({
              ...context.repo,
              comment_id: existing.id,
              body: [
                marker,
                "## Docs preview destroyed",
                "",
                "This PR is closed; its preview stage has been torn down.",
              ].join("\n"),
            });
