# Ephemeral Cloudflare e2e: deploy a unique Alchemy stage, run test/e2e, destroy.
#
# Secrets come from the GitHub Environment "Development" (not repository secrets):
#   CLOUDFLARE_ACCOUNT_ID
#   CLOUDFLARE_API_TOKEN
# Optional:
#   RIPPLE_TOKEN — only if the peer is deployed with bearer auth
#
# Same flow as `bun run test:e2e:cf` (scripts/e2e-cloudflare.sh). See
# .cursor/CLOUD.md for token permission groups.
name: E2E Cloudflare

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: e2e-cf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e-cloudflare
    runs-on: ubuntu-latest
    environment: Development
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Deploy, e2e, destroy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RIPPLE_TOKEN: ${{ secrets.RIPPLE_TOKEN }}
          # Unique per run so concurrent/cancelled jobs never share state.
          ALCHEMY_STAGE: e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set on the Development environment (Settings → Environments → Development). See .cursor/CLOUD.md."
            exit 1
          fi
          bun run test:e2e:cf
