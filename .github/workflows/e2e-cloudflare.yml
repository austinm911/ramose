name: e2e-cloudflare

# Runs the e2e suite against a REAL Cloudflare deployment. This deploys a
# throwaway, uniquely-named stage, runs test/e2e against it, and destroys the
# stage afterwards (even on failure).
#
# Manual-only by design: deploying to Cloudflare has side effects and may incur
# cost, so it is not run on every push/PR. Trigger it from the Actions tab.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   - deploy Workers + R2 (+ Durable Objects). See
#                            .cursor/CLOUD.md for the exact permission groups.
#   CLOUDFLARE_ACCOUNT_ID  - account to deploy into.
on:
  workflow_dispatch:

concurrency:
  group: e2e-cloudflare
  cancel-in-progress: false

jobs:
  e2e:
    name: e2e against Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Deploy → e2e → destroy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repository secrets."
            exit 1
          fi
          bun run test:e2e:cf
